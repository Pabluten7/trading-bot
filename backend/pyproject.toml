[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Automated S&P500 swing trading bot"
requires-python = ">=3.12"

dependencies = [
    # ── API ──────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # ── Base de datos ─────────────────────────────────────
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",          # driver async PostgreSQL
    "psycopg2-binary>=2.9.9",   # driver sync (Alembic)

    # ── Validación / Config ───────────────────────────────
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",

    # ── Cache / Cola ──────────────────────────────────────
    "redis>=5.1.0",
    "celery>=5.4.0",
    "celery[redis]>=5.4.0",

    # ── Broker ───────────────────────────────────────────
    "alpaca-py>=0.31.0",

    # ── Análisis técnico ──────────────────────────────────
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b",
    "numpy>=1.26.0",

    # ── Scheduler ────────────────────────────────────────
    "apscheduler>=3.10.4",
    "exchange-calendars>=4.5.4",  # festivos NYSE

    # ── HTTP ─────────────────────────────────────────────
    "httpx>=0.27.0",

    # ── Notificaciones ───────────────────────────────────
    "python-telegram-bot>=21.5",
    "aiosmtplib>=3.0.0",

    # ── Utils ────────────────────────────────────────────
    "structlog>=24.4.0",
    "tenacity>=9.0.0",          # reintentos con backoff
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",             # TestClient async
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── MyPy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"
