[project]
name = "trading-bot"
version = "0.1.0"
description = "Professional Swing Trading Bot"
readme = "README.md"
requires-python = ">=3.13"

authors = [
    { name = "Tu Nombre" }
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",

    "pydantic",
    "pydantic-settings",

    "sqlalchemy",
    "alembic",

    "pandas",
    "numpy",

    "httpx",

    "python-dotenv",

    "loguru",

    "alpaca-py",

    "pandas-ta",

    "apscheduler",

    "orjson",

    "rich"
]

[project.optional-dependencies]

dev = [

    "pytest",

    "pytest-asyncio",

    "ruff",

    "mypy",

    "pre-commit"

]

[tool.ruff]

line-length = 100

target-version = "py313"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

[tool.mypy]

python_version = "3.13"

strict = true

ignore_missing_imports = true
